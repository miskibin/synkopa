name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # the release builds Linux on the oldest supported Ubuntu LTS, so the packages start on
  # Ubuntu 22.04 / Debian 12 (glibc 2.35): a new dependency that needs a newer glibc fails here,
  # not at release time
  linux-old-glibc:
    name: Linux — builds on Ubuntu 22.04 and needs at most glibc 2.35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Build
        run: cargo build --release -p wave-app
      - name: glibc 2.35 at most
        run: |
          need=$(objdump -T target/release/wave-app | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1)
          echo "wave-app needs $need"
          newest=$(printf '%s\n%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)
          [ "$newest" = "GLIBC_2.35" ] || { echo "::error::wave-app needs $need, newer than Ubuntu 22.04's glibc 2.35"; exit 1; }

  linux:
    name: Linux — format, lints, engine tests, UI tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: System libraries (ALSA, WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # LV2 hosting: liblilv (opened at run time) and real plugins for crates/lv2-host/tests and
      # app's LV2 test: swh-lv2 (a mono amplifier of known gain), x42-plugins (dpl reports
      # latency), lsp-plugins-lv2 (many use the worker extension)
      - name: LV2 (lilv and plugins)
        run: sudo apt-get install -y liblilv-0-0 lilv-utils swh-lv2 x42-plugins lsp-plugins-lv2 && lv2ls | wc -l
      # Plugin windows on Linux: a virtual X server, and plugins with interfaces of their own:
      # DISTRHO's (dpf-plugins-vst3: Nekobi, the framework Vitalium is built with) for
      # crates/vst3-host/tests/editor_gui.rs, x42's equaliser (above) for crates/lv2-host/tests/ui_gui.rs
      - name: Plugin windows (Xvfb, DPF plugins)
        run: sudo apt-get install -y xvfb dpf-plugins-vst3 && ls /usr/lib/vst3 | head
      # a comma-decimal locale for app's locale_tests (it fails on Linux CI without one)
      - name: Comma-decimal locale (de_DE.UTF-8)
        run: sudo apt-get install -y locales && sudo locale-gen de_DE.UTF-8
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build
      # the UI's user journeys in Chromium, against the dev server and the in-browser mock engine
      - name: UI end-to-end (Playwright)
        run: pnpm --dir ui exec playwright install --with-deps chromium && pnpm --dir ui test:e2e
      - name: Upload Library screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-collapse-screenshots
          path: ui/e2e/.results/**/library-*.png
          if-no-files-found: ignore
      - name: Upload tempo-follow screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempo-follow-screenshots
          path: ui/e2e/.results/**/tempo-follow-*.png
          if-no-files-found: ignore
      - name: Upload fit-view screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fit-view-screenshots
          path: ui/e2e/.results/**/fit-view-*.png
          if-no-files-found: ignore
      - name: Upload the traces of failed journeys
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: ui-e2e-results, path: ui/e2e/.results, if-no-files-found: ignore }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # a real VST3 instrument for crates/vst3-host/tests/instrument.rs
      - name: Synkopa Demo Synth
        run: node scripts/build-demo-synth.mjs --debug
      # under a virtual display: the plugin-window tests open real windows and click them
      - run: xvfb-run -a -s "-screen 0 1600x900x24" cargo test --workspace
        env:
          # the LV2 tests fail instead of skipping when lilv or the plugins above are missing
          WAVE_REQUIRE_LV2: "1"
          # so do the plugin-window tests without a display or their plugins
          WAVE_REQUIRE_X11: "1"
          WAVE_REQUIRE_PLUGIN_GUI: "1"
          WAVE_VST3_TEST_INSTRUMENT: ${{ github.workspace }}/app/resources/plugins/WAVE Demo Synth.vst3

  windows:
    name: Windows — ASIO build + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cpal's asio-sys runs bindgen (needs libclang) and downloads the Steinberg ASIO SDK itself.
      - name: LLVM for bindgen
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      # asio-sys downloads the SDK to %TEMP%\asio_sdk once and then trusts that the directory
      # existing means it is complete, so one flaky download poisons the runner until its TEMP
      # resets (red runs #275/#276-merge: "os error 3" walking asio_sdk\host). Fetch it here
      # with retries, verify the layout asio-sys binds against, and hand it the path so its
      # own fetch never runs.
      - name: ASIO SDK with retries
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'asio_sdk'
          for ($try = 1; $try -le 3; $try++) {
            try {
              $zip = Join-Path $env:RUNNER_TEMP 'asiosdk.zip'
              Invoke-WebRequest -Uri 'https://www.steinberg.net/asiosdk' -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
              $staging = Join-Path $env:RUNNER_TEMP 'asio_extract'
              Expand-Archive -Path $zip -DestinationPath $staging -Force
              $root = (Get-ChildItem $staging -Directory | Where-Object Name -like 'asio*' | Select-Object -First 1).FullName
              if (-not $root) { throw "the archive holds no asio* directory" }
              Move-Item $root $sdk
              $need = 'asio.h', 'asiosys.h', 'asiodrivers.h'
              $have = Get-ChildItem $sdk -Recurse -Filter *.h | Select-Object -ExpandProperty Name
              $missing = @($need | Where-Object { $_ -notin $have })
              if ($missing.Count -gt 0) { throw "the SDK is missing headers: $($missing -join ', ')" }
              foreach ($d in 'common', 'host', 'host\pc') {
                if (-not (Test-Path (Join-Path $sdk $d))) { throw "the SDK is missing the $d directory" }
              }
              "CPAL_ASIO_DIR=$sdk" >> $env:GITHUB_ENV
              Write-Host "ASIO SDK ready at $sdk (attempt $try)"
              break
            } catch {
              Write-Host "attempt $try failed: $_"
              if (Test-Path $sdk) { Remove-Item -Recurse -Force $sdk }
            }
          }
          if (-not (Test-Path "$sdk/common") -or -not (Test-Path "$sdk/host/pc")) { throw "no verified ASIO SDK after 3 attempts" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      # a real VST3 instrument for crates/vst3-host/tests/instrument.rs, and the installer's
      - name: Synkopa Demo Synth
        run: node scripts/build-demo-synth.mjs --debug
      - name: Tests
        run: cargo test --workspace
        env:
          WAVE_VST3_TEST_INSTRUMENT: ${{ github.workspace }}/app/resources/plugins/WAVE Demo Synth.vst3
      - name: ASIO device recovery tests
        run: cargo test --locked -p wave-audio-io --features asio
      - name: Build app with ASIO and the session CLI
        run: |
          cargo build --locked -p wave-app -p wave-cli --features asio,custom-protocol
      - name: Bundle NSIS installer
        working-directory: app
        run: pnpm dlx @tauri-apps/cli@2.12.4 bundle --debug --features asio --bundles nsis --ci
      - name: Test project file association
        shell: pwsh
        run: ./scripts/test-project-association.ps1
