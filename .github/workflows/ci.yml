name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux — format, lints, engine tests, UI tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: System libraries (ALSA, WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # LV2 hosting: liblilv (opened at run time) and real plugins for crates/lv2-host/tests and
      # app's LV2 test: swh-lv2 (a mono amplifier of known gain), x42-plugins (dpl reports
      # latency), lsp-plugins-lv2 (many use the worker extension)
      - name: LV2 (lilv and plugins)
        run: sudo apt-get install -y liblilv-0-0 lilv-utils swh-lv2 x42-plugins lsp-plugins-lv2 && lv2ls | wc -l
      # Plugin windows on Linux: a virtual X server, and plugins with interfaces of their own:
      # DISTRHO's (dpf-plugins-vst3: Nekobi, the framework Vitalium is built with) for
      # crates/vst3-host/tests/editor_gui.rs, x42's equaliser (above) for crates/lv2-host/tests/ui_gui.rs
      - name: Plugin windows (Xvfb, DPF plugins)
        run: sudo apt-get install -y xvfb dpf-plugins-vst3 && ls /usr/lib/vst3 | head
      # a comma-decimal locale for app's locale_tests (it fails on Linux CI without one)
      - name: Comma-decimal locale (de_DE.UTF-8)
        run: sudo apt-get install -y locales && sudo locale-gen de_DE.UTF-8
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # a real VST3 instrument for crates/vst3-host/tests/instrument.rs
      - name: WAVE Demo Synth
        run: node scripts/build-demo-synth.mjs --debug
      # under a virtual display: the plugin-window tests open real windows and click them
      - run: xvfb-run -a -s "-screen 0 1600x900x24" cargo test --workspace
        env:
          # the LV2 tests fail instead of skipping when lilv or the plugins above are missing
          WAVE_REQUIRE_LV2: "1"
          # so do the plugin-window tests without a display or their plugins
          WAVE_REQUIRE_X11: "1"
          WAVE_REQUIRE_PLUGIN_GUI: "1"
          WAVE_VST3_TEST_INSTRUMENT: ${{ github.workspace }}/app/resources/plugins/WAVE Demo Synth.vst3

  windows:
    name: Windows — ASIO build + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cpal's asio-sys runs bindgen (needs libclang) and downloads the Steinberg ASIO SDK itself.
      - name: LLVM for bindgen
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      # a real VST3 instrument for crates/vst3-host/tests/instrument.rs, and the installer's
      - name: WAVE Demo Synth
        run: node scripts/build-demo-synth.mjs --debug
      - name: Tests
        run: cargo test --workspace
        env:
          WAVE_VST3_TEST_INSTRUMENT: ${{ github.workspace }}/app/resources/plugins/WAVE Demo Synth.vst3
      - name: ASIO device recovery tests
        run: cargo test --locked -p wave-audio-io --features asio
      - name: Build app with ASIO and the session CLI
        run: |
          cargo build --locked -p wave-app -p wave-cli --features asio,custom-protocol
      - name: Bundle NSIS installer
        working-directory: app
        run: pnpm dlx @tauri-apps/cli@2.12.4 bundle --debug --features asio --bundles nsis --ci
      - name: Test project file association
        shell: pwsh
        run: ./scripts/test-project-association.ps1
