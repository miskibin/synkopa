[package]
name = "wave-lv2"
description = "WAVE: LV2 effects as wave_engine::Processor insert effects on Linux (liblilv loaded at run time)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wave-engine.workspace = true
wave-plugin-scan.workspace = true
wave-plugin-windows = { path = "../plugin-windows" }
rtrb.workspace = true
serde.workspace = true
log.workspace = true
parking_lot.workspace = true

# liblilv-0.so.0 is opened with `dlopen` when LV2 is first used, not linked: a system
# without it still builds and runs WAVE, with LV2 reported as unavailable.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true

# tests/ui_gui.rs turns a real plugin interface's knob like a user does
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
