[package]
name = "wave-stems"
description = "Stem separation (Demucs v4 / HTDemucs through ONNX Runtime): drums, bass, other and vocals from a mix."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
realfft.workspace = true
parking_lot.workspace = true
# `ort_init`: one place knows where ONNX Runtime lives on each platform.
wave-rmvpe.workspace = true

[dev-dependencies]
wave-audio-file.workspace = true
hound.workspace = true

# Same ONNX Runtime build as crates/rmvpe (see the note there about Linux).
[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "tls-native", "api-20"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-20"] }
