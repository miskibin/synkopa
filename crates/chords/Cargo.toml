[package]
name = "wave-chords"
description = "Chord recognition (ChordMini through ONNX Runtime) as a Synkopa chord model."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wave-engine.workspace = true
realfft.workspace = true
parking_lot.workspace = true
# `ort_env`/`models_dir`: one ONNX Runtime environment and one models folder for every model.
wave-rmvpe.workspace = true
# `resample`: the offline windowed-sinc resampler the stem separator uses.
wave-stems.workspace = true

[dev-dependencies]
sha2.workspace = true

# Same ONNX Runtime build as crates/rmvpe (see the note there about Linux).
[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "tls-native", "api-20"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-20"] }
