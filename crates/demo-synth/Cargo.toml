[package]
name = "wave-demo-synth"
description = "Synkopa Demo Synth: a small polyphonic VST3 instrument shipped with Synkopa, and the real plugin its hosting tests run against."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wave_demo_synth"
# cdylib: the plugin module; rlib: the DSP tests
crate-type = ["cdylib", "rlib"]

[dependencies]
# Raw COM-style bindings for the VST3 API (coupler-rs, MIT/Apache), as the host uses.
vst3 = "0.3"
